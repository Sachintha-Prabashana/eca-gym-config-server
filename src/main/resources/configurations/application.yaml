eureka:
  client:
    service-url:
      defaultZone: http://localhost:9000/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    lk.ijse.eca: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: a-very-secure-jwt-secret-key-that-should-be-at-least-256-bits-long
  expiration: 900000 # 15 minutes in ms
  refresh-expiration: 604800000 # 7 days in ms